name: Build and Lint

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with `engines.node` in package.json
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # `npm ci` installs exactly what the lockfile says, and fails if it's out of sync with package.json
      - name: Install dependencies
        run: npm ci

      - name: Lint the project
        run: npm run lint

      - name: Build the project
        run: npm run build

      - name: Test the project
        run: npm test

  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      # Only the runtime dependencies, since those are what users install along with the plugin.
      # Fails on high and critical vulnerabilities; lower severities are only reported.
      - name: Audit the runtime dependencies
        run: npm audit --omit=dev --audit-level=high
